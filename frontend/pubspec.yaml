name: internhub_app
description: AI-Based Cross-Platform Internship Aptitude Test & Recruitment Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ─────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ───────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── HTTP Client ──────────────────────────────────────────────────
  dio: ^5.7.0

  # ─── Secure Storage ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ─── Local Database (offline mode) ────────────────────────────────
  hive_flutter: ^1.1.0

  # ─── Encryption ────────────────────────────────────────────────────
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # ─── WebSocket ────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1

  # ─── Charts ───────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ─── Connectivity ─────────────────────────────────────────────────
  connectivity_plus: ^6.0.5

  # ─── Serialization ────────────────────────────────────────────────
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # ─── Device Info ──────────────────────────────────────────────────
  device_info_plus: ^10.1.2

  # ─── Shared Preferences ───────────────────────────────────────────
  shared_preferences: ^2.3.3

  # ─── Image Handling ───────────────────────────────────────────────
  cached_network_image: ^3.4.1

  # ─── UI ───────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # ─── Utils ────────────────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  image_picker: ^1.2.1
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.4.1
  json_serializable: ^6.8.0
  riverpod_generator: ">=2.3.0 <2.4.4"
  mocktail: ^1.0.4
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
